version: 2.5.0-a1
pr_number: 93
new_features:
- title: Adds the `salesforce__source_config` variable
  description: Replaces the live-schema check (`adapter.get_columns_in_relation`)
    that staging and daily history models previously ran at every `dbt run` and `dbt
    compile`. Use it to declare column renames and fields your connector doesn't sync,
    on a per-table basis.
  details:
  - Add an entry only for a column that's actually renamed or missing; everything
    else keeps working under its standard name.
  - 'Set `naming_standard: source` for a connection that syncs columns under their
    raw connector spelling, so unlisted columns default to that spelling instead of
    Fivetran''s standard name.'
  - 'Set `fivetran_packages_using_introspective_queries: true` to keep the previous
    live-schema check instead. This restores automatic column detection only, not
    the camelCase/snake_case coalescing earlier versions also did.'
  - If your connector left a field in a non-standard spelling and you don't declare
    it, the build now fails with a column-not-found error instead of resolving it
    automatically.
  - See the sample configuration in [`integration_tests/dbt_project.yml`](https://github.com/fivetran/dbt_salesforce/blob/v2.5.0-a1/integration_tests/dbt_project.yml).
under_the_hood:
- title: Renames 9 table identifier variables to match the Salesforce API's object
    names
  description: '`salesforce_campaign_member_identifier`, `salesforce_record_type_identifier`,
    `salesforce_user_role_identifier`, `salesforce_product_2_identifier`, `salesforce_opportunity_line_item_identifier`,
    and the four `*_history_identifier` variables are renamed to their Salesforce
    API object name (e.g. `salesforce_campaignmember_identifier`), consistent with
    how `salesforce__source_config` is keyed.'
  details:
  - The old variable names still work as a fallback, so no action is required.
date: '2026-10-22'
