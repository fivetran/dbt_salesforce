version: 2.5.0-a3
pr_number: 100
under_the_hood:
- title: Source column names in source yml
  description: Moves each column's Salesforce API name (for example, `RecordTypeId`)
    from the `get_*_columns` macros to `config.meta.source_column_name` in `src_salesforce.yml`
    and `src_salesforce_history.yml`. The names now live in one place and appear in
    `manifest.json`.
  details:
  - '`resolve_source_columns` reads each column''s source column name from the source yml.
    Columns without one, such as `_fivetran_*` and pass-through columns, use their
    own name.'
  - Adds 6 columns that the history models select to `src_salesforce_history.yml`
    documentation.
  - No change to model output.
date: '2026-11-06'
