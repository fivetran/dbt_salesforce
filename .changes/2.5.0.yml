version: 2.5.0
pr_number: 101
new_features:
- description: Raises the minimum dbt version to 1.10.0.
under_the_hood:
- description: Removes `opportunity_account_id` from the `salesforce__opportunity_enhanced`
    model of the `salesforce.yml` file.
- description: Removes `billing_country_code`, `billing_geocode_accuracy`, `billing_latitude`,
    `billing_longitude`, `fax`, `jigsaw_company_id`, `phone`, `photo_url`, `shipping_geocode_accuracy`,
    `shipping_latitude`, `shipping_longitude`, `sic`, `sic_desc`, `site`, and `ticker_symbol`
    from the `stg_salesforce__account` model of the `stg_salesforce.yml` file.
- description: Removes `is_excluded_from_territory_2_filter`, `Pricebook2Id`, `pricebook_2_id`,
    and `territory_2_id` from the `stg_salesforce__opportunity` model of the `stg_salesforce.yml`
    file.
- description: Removes `about_me`, `badge_text`, `banner_photo_url`, `call_center_id`,
    `community_nickname`, `default_group_notification_frequency`, `delegated_approver_id`,
    `digest_frequency`, `division`, `email_encoding_key`, `email_preferences_auto_bcc`,
    `employee_number`, `extension`, `fax`, `federation_identifier`, `forecast_enabled`,
    `full_photo_url`, `geocode_accuracy`, `is_profile_photo_active`, `language_locale_key`,
    `latitude`, `locale_sid_key`, `longitude`, `medium_banner_photo_url`, `mobile_phone`,
    `offline_trial_expiration_date`, `phone`, `receives_admin_info_emails`, `receives_info_emails`,
    `sender_email`, `sender_name`, `signature`, `small_banner_photo_url`, `small_photo_url`,
    and `time_zone_sid_key` from the `stg_salesforce__user` model of the `stg_salesforce.yml`
    file.
- description: Removes `case_access_for_account_owner`, `contact_access_for_account_owner`,
    `forecast_user_id`, `may_forecast_manager_share`, and `portal_type` from the `stg_salesforce__user_role`
    model of the `stg_salesforce.yml` file.
- description: Removes `_fivetran_active` from the `stg_salesforce__contact` model
    of the `stg_salesforce.yml` file.
- description: Removes `_fivetran_active` and `duration_in_minutes` from the `stg_salesforce__event`
    model of the `stg_salesforce.yml` file.
- description: Removes `_fivetran_active`, `fax`, `jigsaw_contact_id`, `latitude`,
    `longitude`, `photo_url`, `salutation`, and `system_modstamp` from the `stg_salesforce__lead`
    model of the `stg_salesforce.yml` file.
- description: Removes `_fivetran_active` from the `stg_salesforce__opportunity_line_item`
    model of the `stg_salesforce.yml` file.
- description: Removes `_fivetran_active`, `billing_geocode_accuracy`, `shipping_geocode_accuracy`,
    and `status_code` from the `stg_salesforce__order` model of the `stg_salesforce.yml`
    file.
- description: Removes `_fivetran_active`, `external_data_source_id`, `stock_keeping_unit`,
    and `system_modstamp` from the `stg_salesforce__product_2` model of the `stg_salesforce.yml`
    file.
- description: Removes `_fivetran_active` and `system_modstamp` from the `stg_salesforce__task`
    model of the `stg_salesforce.yml` file.
- description: Renames `campaign_description` to `description`, `campaign_name` to
    `name`, `campaign_status` to `status`, `campaign_type` to `type`, `parent_campaign_id`
    to `parent_id`, and `total_pipeline_amount` to `amount_all_opportunities` in the
    `salesforce__campaign_daily_history` model of the `salesforce_history.yml` file.
- description: Adds `mailing_country_code` to the `salesforce__contact_daily_history`
    model of the `salesforce_history.yml` file.
