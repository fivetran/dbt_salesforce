vars:
  # enable history models when generating docs!
  # salesforce__campaign_history_enabled: true # @docs-include
  # salesforce__contact_history_enabled: true # @docs-include
  # salesforce__account_history_enabled: true # @docs-include
  # salesforce__opportunity_history_enabled: true # @docs-include

  salesforce:
    salesforce_schema: zz_dbt_catherine #salesforce_integrations_tests_4
    salesforce_history_schema: zz_dbt_catherine #salesforce_integrations_tests_4

    salesforce_account_identifier: "sf_account_data"
    salesforce_campaign_identifier: "sf_campaign_data"
    salesforce_campaign_member_identifier: "sf_campaign_member_data"
    salesforce_opportunity_identifier: "sf_opportunity_data"
    salesforce_record_type_identifier: "sf_record_type_data"
    salesforce_user_identifier: "sf_user_data"
    salesforce_user_role_identifier: "sf_user_role_data"
    salesforce_contact_identifier: "sf_contact_data"
    salesforce_lead_identifier: "sf_lead_data"
    salesforce_task_identifier: "sf_task_data"
    salesforce_event_identifier: "sf_event_data"
    salesforce_product_2_identifier: "sf_product_2_data"
    salesforce_order_identifier: "sf_order_data"
    salesforce_opportunity_line_item_identifier: "sf_opportunity_line_item_data"

    ##history mode identifiers
    salesforce_campaign_history_identifier: "sf_campaign_history_data"
    salesforce_account_history_identifier: "sf_account_history_data"
    salesforce_contact_history_identifier: "sf_contact_history_data"
    salesforce_opportunity_history_identifier: "sf_opportunity_history_data"

    ## Staging v2 POC: exhaustive source-config payloads simulating what the quickstart runtime
    ## would supply per table (Salesforce API source field name -> current name in the
    ## destination), replacing adapter.get_columns_in_relation introspection in staging.
    ## Keyed by the connector's own immutable source names (not our destination/canonical
    ## names), per the agreed design in GA-1038188 -- destination names aren't stable (they
    ## shift with feature flags/settings/renames), but source names are. Each table's `name`
    ## field is reserved for a future identifier migration (GA-1038188) and is NOT consumed by
    ## this package yet -- table identifiers still come from the plain
    ## salesforce_<table>[_history]_identifier vars above. Identity-mapped for every column
    ## except Account's AccountNumber (demonstrates a source field the connector did NOT
    ## snake_case -- it's still literally "AccountNumber" in the destination) and Opportunity's
    ## Description (mapped to a custom renamed spelling, Description__c, see
    ## sf_opportunity_data.csv) -- together proving both the "connector left it alone" and the
    ## "customer renamed it" paths, not just pure identity-mapping. select_payload_fields
    ## computes each column's source field name from its canonical name via the same
    ## name.split('_') | map('capitalize') | join('') transform the now-retired
    ## add_renamed_columns macro used to guess spellings with -- this package's own column list
    ## never needed an explicit override for it historically, across every table. Fivetran
    ## metadata columns (_fivetran_*) are never looked up here; they're synthetic, not real
    ## Salesforce fields, and always pass through under their own name.
    salesforce__source_config:
      zz_dbt_catherine:
        Account:
          name: sf_account_data
          columns:
            AccountNumber: AccountNumber
            AccountSource: account_source
            AnnualRevenue: annual_revenue
            BillingCity: billing_city
            BillingCountry: billing_country
            BillingPostalCode: billing_postal_code
            BillingState: billing_state
            BillingStateCode: billing_state_code
            BillingStreet: billing_street
            Description: description
            Id: id
            Industry: industry
            IsDeleted: is_deleted
            LastActivityDate: last_activity_date
            LastReferencedDate: last_referenced_date
            LastViewedDate: last_viewed_date
            MasterRecordId: master_record_id
            Name: name
            NumberOfEmployees: number_of_employees
            OwnerId: owner_id
            Ownership: ownership
            ParentId: parent_id
            Rating: rating
            RecordTypeId: record_type_id
            ShippingCity: shipping_city
            ShippingCountry: shipping_country
            ShippingCountryCode: shipping_country_code
            ShippingPostalCode: shipping_postal_code
            ShippingState: shipping_state
            ShippingStateCode: shipping_state_code
