    ## would supply per table (canonical_name: current_name_in_source), replacing
    ## adapter.get_columns_in_relation introspection in staging. Identity-mapped for every
    ## column except opportunity's `description`, which is deliberately mapped to a renamed
    ## spelling (Description__c, see sf_opportunity_data.csv) to prove the rename-without-
    ## introspection path, not just the identity-mapping path.
