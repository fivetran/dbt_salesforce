name: 'salesforce_integration_tests'
version: '2.3.0'
config-version: 2

profile: 'integration_tests'

models:
  +persist_docs:
    relation: true
    columns: "{{ false if target.type in ('databricks') else true }}"
  +schema: "salesforce_{{ var('directed_schema','dev') }}"

vars:
  # enable history models when generating docs!
  # salesforce__contact_history_enabled: true # @docs-include
  # salesforce__account_history_enabled: true # @docs-include
  # salesforce__opportunity_history_enabled: true # @docs-include

  salesforce:
    salesforce_schema: salesforce_integrations_tests_4
    salesforce_history_schema: salesforce_integrations_tests_4

    salesforce_account_identifier: "sf_account_data"
    salesforce_campaign_identifier: "sf_campaign_data"
    salesforce_campaign_member_identifier: "sf_campaign_member_data"
    salesforce_opportunity_identifier: "sf_opportunity_data"
    salesforce_record_type_identifier: "sf_record_type_data"
    salesforce_user_identifier: "sf_user_data"
    salesforce_user_role_identifier: "sf_user_role_data"
    salesforce_contact_identifier: "sf_contact_data"
    salesforce_lead_identifier: "sf_lead_data"
    salesforce_task_identifier: "sf_task_data"
    salesforce_event_identifier: "sf_event_data"
    salesforce_product_2_identifier: "sf_product_2_data"
    salesforce_order_identifier: "sf_order_data"
    salesforce_opportunity_line_item_identifier: "sf_opportunity_line_item_data"

    ##history mode identifiers
    salesforce_account_history_identifier: "sf_account_history_data"
    salesforce_contact_history_identifier: "sf_contact_history_data"
    salesforce_opportunity_history_identifier: "sf_opportunity_history_data"

seeds:
  +docs:
    show: False
  salesforce_integration_tests:
    +quote_columns: "{{ true if target.type in ('redshift', 'postgres') else false }}"
    sf_account_data:
      +column_types:
        _fivetran_synced: timestamp
        _fivetran_active: boolean
        last_activity_date: timestamp
        last_referenced_date: timestamp
        last_viewed_date: timestamp
        annual_revenue: float
        billing_latitude: float
        billing_longitude: float
        shipping_latitude: float
        shipping_longitude: float
    sf_campaign_data:
      +column_types:
        _fivetran_synced: timestamp
        _fivetran_active: boolean
        start_date: timestamp
        end_date: timestamp
        is_active: boolean
        is_deleted: boolean
        budgeted_cost: float
        actual_cost: float
        number_of_leads: integer
        number_of_converted_leads: integer
        number_of_contacts: integer
        number_of_responses: integer
        number_of_opportunities: integer
        number_of_won_opportunities: integer
        amount_all_opportunities: float
    sf_campaign_member_data:
      +column_types:
        _fivetran_synced: timestamp
        _fivetran_active: boolean
        created_date: timestamp
        first_responded_date: timestamp
        has_responded: boolean
        is_deleted: boolean
    sf_record_type_data:
      +column_types:
        _fivetran_synced: timestamp
        _fivetran_active: boolean
        is_active: boolean
        is_master: boolean
    sf_opportunity_data:
      +column_types:
        _fivetran_synced: timestamp
        _fivetran_active: boolean
        close_date: timestamp
        created_date: timestamp
        last_activity_date: timestamp
        last_referenced_date: timestamp
        last_viewed_date: timestamp
        amount: float
        probability: float
    sf_user_data:
      +column_types:
        _fivetran_synced: timestamp
        _fivetran_active: boolean
        last_login_date: timestamp
        last_referenced_date: timestamp
        last_viewed_date: timestamp
        offline_trial_expiration_date: timestamp
        latitude: float
        longitude: float
    sf_contact_data:
      +column_types:
        _fivetran_synced: timestamp
        _fivetran_active: boolean
        created_date: timestamp
        email_bounced_date: timestamp
        last_activity_date: timestamp
        last_curequest_date: timestamp
        last_cuupdate_date: timestamp
        last_modified_date: timestamp
        last_referenced_date: timestamp
        last_viewed_date: timestamp
        system_modstamp: timestamp
        is_deleted: boolean
    sf_lead_data:
      +column_types:
        _fivetran_synced: timestamp
        _fivetran_active: boolean
        converted_date: timestamp
        created_date: timestamp
        email_bounced_date: timestamp
        last_activity_date: timestamp
        last_modified_date: timestamp
        last_referenced_date: timestamp
        last_viewed_date: timestamp
        system_modstamp: timestamp
        is_deleted: boolean
    sf_task_data:
      +column_types:
        _fivetran_synced: timestamp
        _fivetran_active: boolean
        activity_date: timestamp
        completed_date_time: timestamp
        created_date: timestamp
        last_modified_date: timestamp
        recurrence_end_date_only: timestamp
        recurrence_start_date_only: timestamp
        reminder_date_time: timestamp
        system_modstamp: timestamp
        is_deleted: boolean
    sf_event_data:
      +column_types:
        _fivetran_synced: timestamp
        _fivetran_active: boolean
        activity_date: timestamp
        activity_date_time: timestamp
        created_date: timestamp
        end_date_time: timestamp
        last_modified_date   : timestamp
        recurrence_2_pattern_start_date   : timestamp
        recurrence_end_date_only: timestamp
        recurrence_start_date_time: timestamp
        reminder_date_time: timestamp
        start_date_time: timestamp
        system_modstamp: timestamp
        is_deleted: boolean
    sf_product_2_data:
      +column_types:
        _fivetran_synced: timestamp
        _fivetran_active: boolean
        created_date: timestamp
        last_modified_date: timestamp
        last_referenced_date: timestamp
        last_viewed_date: timestamp
        system_modstamp: timestamp
        is_deleted: boolean
    sf_order_data:
      +column_types:
        _fivetran_synced: timestamp
        _fivetran_active: boolean
        activated_date: timestamp
        created_date: timestamp
        effective_date: timestamp
        end_date: timestamp
        last_modified_date: timestamp
        last_referenced_date: timestamp
        last_viewed_date: timestamp
        system_modstamp: timestamp
        is_deleted: boolean
    sf_opportunity_line_item_data:
      +column_types:
        _fivetran_synced: timestamp
        _fivetran_active: boolean
        created_date: timestamp
        last_modified_date: timestamp
        last_referenced_date: timestamp
        last_viewed_date: timestamp
        service_date: timestamp
        system_modstamp: timestamp
        is_deleted: boolean

    sf_account_history_data:
      +column_types:
        _fivetran_synced: timestamp
        _fivetran_active: boolean
        annual_revenue: float
        last_activity_date: timestamp
        last_referenced_date: timestamp
        last_viewed_date: timestamp
        is_deleted: boolean
    sf_contact_history_data:
      +column_types:
        _fivetran_synced: timestamp
        _fivetran_active: boolean
        last_activity_date: timestamp 
        last_modified_date: timestamp 
        last_viewed_date: timestamp
        is_deleted: boolean
    sf_opportunity_history_data:
      +column_types:
        _fivetran_synced: timestamp
        _fivetran_active: boolean
        close_date: timestamp
        created_date: timestamp
        last_activity_date: timestamp
        last_referenced_date: timestamp
        last_viewed_date: timestamp
        amount: float
        expected_revenue: float
        is_deleted: boolean

dispatch:
  - macro_namespace: dbt_utils
    search_order: ['spark_utils', 'dbt_utils']

clean-targets:
    - target
    - dbt_modules
    - dbt_packages

flags:
  send_anonymous_usage_stats: False


  use_colors: True