#   bigquery: ">=1.3.0,<2.0.0"
#   postgres: ">=1.3.0,<2.0.0"
#   redshift: ">=1.3.0,<2.0.0"
#   databricks: ">=1.6.0,<2.0.0"

schema_variable_name: "salesforce_schema"
additional_schema_variables:
  - "salesforce_history_schema"

include_databricks_sql: false
include_sqlserver: false
include_dbt_compile: true
include_duckdb: true

test_scenarios:
  # Committed config (Legacy sync mode)
  - name: "Default"
    vars: {}
    include_incremental: false

  # Scenario configs replace the committed one, so renames repeat. RecordType's seed has no _fivetran_active.
  - name: "history sync mode"
    vars:
      salesforce__source_config:
        salesforce:
          sync_mode: History
          Account:
            name: sf_account_data
            columns:
              AccountNumber: AccountNumber
              Website: "<fivetran_not_synced>"
          Opportunity:
            name: sf_opportunity_data
            columns:
              Description: Description__c
          RecordType:
            name: sf_record_type_data
            sync_mode: Legacy
    include_incremental: false

  - name: "live sync mode"
    vars:
      salesforce__source_config:
        salesforce:
          sync_mode: Live
          Account:
            name: sf_account_data
            columns:
              AccountNumber: AccountNumber
              Website: "<fivetran_not_synced>"
          Opportunity:
            name: sf_opportunity_data
            columns:
              Description: Description__c
    include_incremental: false

  - name: "features disabled"
    vars:
      salesforce__user_role_enabled: false
      salesforce__campaign_enabled: false
    include_incremental: false

  - name: "history enabled"
    vars:
      salesforce__account_history_enabled: true
      salesforce__campaign_history_enabled: true
      salesforce__contact_history_enabled: true
      salesforce__opportunity_history_enabled: true
    include_incremental: true
